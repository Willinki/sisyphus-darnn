# configs/config.yaml
defaults:
  - model: fc-baseline
  - data: entangled_mnist
  - optimizer: adam
  - trainer: dynamical
  - wandb: default
  - cluster: cpu
  - _self_
  - experiment: null          # placeholder; experiment files slot in here
  - override hydra/launcher: submitit_slurm

# Global training knobs
name: training/${model.name}/${data.name}
master_seed: 44
work_dir: ${oc.env:WORK_DIR,${hydra:runtime.cwd}}

# Only derive values you truly need here
wandb:
  run_name: ${name}

hydra:
  job:
    chdir: false
    config:
      override_dirname:
        include_keys: [model, data]
        exclude_keys: [name]
  run:
    dir: outputs/${name}/${now:%Y-%m-%d-%H-%M-%S}
  sweep:
    dir: multirun/${name}/${now:%Y-%m-%d-%H-%M-%S}
    subdir: cfg:${hydra.job.override_dirname}-${hydra.job.num}
  launcher:
    # use run.dir so it works for both single-run and multirun
    submitit_folder: ${hydra.run.dir}/.submitit/%j
    timeout_min: ${cluster.timeout_min}
    cpus_per_task: 10
    mem_gb: ${cluster.mem_gb}
    nodes: 1
    name: ${hydra.job.name}
    partition: ${cluster.partition}
    gpus_per_task: ${cluster.gpus_per_task}
    array_parallelism: 4
