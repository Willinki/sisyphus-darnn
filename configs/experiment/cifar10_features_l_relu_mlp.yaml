# @package _global_

defaults:
  - override /model: relu-3layer-mlp
  - override /data: cifar_features_l
  - override /wandb: default
  - override /cluster: cpu
  - _self_

data:
  name: "cifar_features_l"
  kwargs:
    batch_size : 64
    x_transform : "identity"

model:
  name: "relu-3layer-mlp"
  kwargs:
    input_dim: 4096
    hidden_dim: 4096
    output_dim: 10
    loss_type: "cross_entropy"
    lr: 1e-3
    optim: "sgd"

wandb:
  tags: ["relu-mlp", "cifar-features-l"]

# Global training knobs
epochs: 50
name: ${model.name}/${data.name}
master_seed: 44
