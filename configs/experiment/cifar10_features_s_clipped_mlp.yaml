# @package _global_

defaults:
  - override /model: clipped-3layer-mlp
  - override /data: cifar_features_s
  - override /wandb: default
  - override /cluster: cpu
  - _self_

optimizer:
  learning_rate: 0.001

data:
  name: "cifar_features_s"
  kwargs:
    batch_size : 64
    x_transform : "identity"

model:
  name: "clipped-3layer-mlp"
  kwargs:
    input_dim: 512
    hidden_dim: 1000
    output_dim: 10
    gain: 1.0
    loss_type: "argmax_margin"
    lr: 1e-3

wandb:
  tags: ["clipped-mlp", "cifar-features-s"]

# Global training knobs
epochs: 10
name: ${model.name}/${data.name}
master_seed: 44
