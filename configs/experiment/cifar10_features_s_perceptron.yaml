# @package _global_

defaults:
  - override /model: rp-sign-perceptron
  - override /data: cifar_features_s
  - override /wandb: default
  - override /cluster: cpu
  - _self_

data:
  name: "cifar_features_s"
  kwargs:
    batch_size : 64
    x_transform : "identity"
    label_mode: "pm1"

model:
  name: rp-sign-perceptron
  kwargs:
    input_dim: 512
    proj_dim: 1000
    output_dim: 10
    margin: 1.0
    lr: 1e-3
    rp_seed: 44
    use_bias: false


wandb:
  tags: ["rp-sign-perceptron", "cifar-features-s"]

# Global training knobs
epochs: 50
name: ${model.name}/${data.name}
master_seed: 44