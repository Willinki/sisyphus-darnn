# @package _global_

defaults:
  - override /model: binary-3layer-mlp
  - override /data: cifar_features_vit
  - override /wandb: default
  - override /cluster: cpu
  - _self_

data:
  name: "cifar_features_vit"
  kwargs:
    batch_size : 64
    x_transform : "identity"

model:
  name: "binary-3layer-mlp"
  kwargs:
    input_dim: 192
    hidden_dim: 1000
    output_dim: 10
    gain: 1.0
    loss_type: "argmax_margin"
    lr: 1e-3
    optim: "sgd"

wandb:
  tags: ["binary-mlp", "cifar-features-vit"]

# Global training knobs
epochs: 50
name: ${model.name}/${data.name}
master_seed: 44
