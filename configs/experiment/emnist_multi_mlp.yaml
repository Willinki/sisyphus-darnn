# @package _global_

defaults:
  - override /model: multi-logit-margin-mlp
  - override /data: general_mnist
  - override /wandb: default
  - override /cluster: cpu
  - _self_

data:
  name: "general_mnist"
  kwargs:
    batch_size: 64
    num_images_per_class:  null
    x_transform:  identity
    linear_projection: null
    label_mode:  "pm1"

model:
  name: multi-logit-margin-mlp
  kwargs:
    input_dim: 784
    hidden_dim: 128
    output_dim: 10
    kappa: 1.0
    lr: 1e-3
    optim: "sgd"
    dropout: 0.0
    use_bias: True
    reduction: "batch_mean_class_sum"

wandb:
  tags: ["multilogit-mlp", "mnist"]

# Global training knobs
epochs: 50
name: ${model.name}/${data.name}
master_seed: 44
