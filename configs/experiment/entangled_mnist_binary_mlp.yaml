# @package _global_

defaults:
  - override /model: binary-3layer-mlp
  - override /data: general_mnist
  - override /wandb: default
  - _self_

data:
  name: "general_mnist"
  kwargs:
    batch_size: 64
    num_images_per_class: null
    x_transform: sign
    linear_projection: 100
    label_mode: "c-rescale"

model:
  name: "clipped-3layer-mlp"
  kwargs:
    input_dim: 100
    hidden_dim: 100
    output_dim: 10
    gain: 1.0
    loss_type: "argmax_margin"
    argmax_margin: 1.0
    lr: 1e-3
    optim: "sgd"
    use_bias: false
    clamp: true
    num_hidden_layers: 2

wandb:
  tags: ["binary-mlp", "mnist"]

# Global training knobs
epochs: 200
name: ${model.name}/${data.name}
master_seed: 44
