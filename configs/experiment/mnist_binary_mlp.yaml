# @package _global_

defaults:
  - override /model: binary-3layer-mlp
  - override /data: general_mnist
  - override /wandb: default
  - override /cluster: cpu
  - _self_

data:
  name: "general_mnist"
  kwargs:
    batch_size: 64
    num_images_per_class:  null
    x_transform:  identity
    linear_projection: null
    label_mode:  "c-rescale"

model:
  name: "binary-3layer-mlp"
  kwargs:
    input_dim: 512
    hidden_dim: 1000
    output_dim: 10
    gain: 1.0
    loss_type: "argmax_margin"
    lr: 1e-3
    optim: "sgd"

wandb:
  tags: ["binary-mlp", "mnist"]

# Global training knobs
epochs: 50
name: ${model.name}/${data.name}
master_seed: 44
