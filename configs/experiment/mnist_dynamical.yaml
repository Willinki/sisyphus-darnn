# @package _global_

defaults:
  - override /model: fc-baseline
  - override /optimizer: adam
  - override /data: general_mnist
  - override /trainer: dynamical
  - override /wandb: default
  - override /cluster: gpu
  - _self_

epochs: 50

optimizer:
  learning_rate: 0.001

data:
  name: general_mnist 
  kwargs:
    batch_size: 64
    num_images_per_class:  null
    x_transform : "identity"
    linear_projection: null
    label_mode:  "c-rescale"

trainer:
  name: "dynamical"
  kwargs:
    warmup_n_iter : 1
    train_clamped_n_iter : 10
    train_free_n_iter : 10
    eval_n_iter : 20

model:
  name: fc-baseline
  kwargs:
    dim_data: 728
    dim_hidden: 1000
    num_labels: 10
    strength_forth: 5.0
    strength_back: 0.9
    threshold_in: 1.0
    threshold_j: 1.0
    threshold_out: 1.0
    j_d: 0.5

wandb:
  tags: ["fc-baseline", "mnist", "dynamical"]