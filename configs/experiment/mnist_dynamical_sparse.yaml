# @package _global_

defaults:
  - override /model: fc-baseline-sparse
  - override /optimizer: sgd
  - override /data: general_mnist
  - override /trainer: dynamical
  - override /wandb: default
  - override /cluster: gpu
  - _self_

epochs: 50

optimizer:
  learning_rate: 0.001
  learning_rate_wout: 0.1
  learning_rate_j: 0.005
  learning_rate_win: 0.01
  weight_decay_win: 0.0
  weight_decay_wout: 0.005
  weight_decay_j: 0.005

data:
  name: general_mnist 
  kwargs:
    batch_size: 64
    num_images_per_class:  null
    x_transform : "identity"
    linear_projection: null
    label_mode:  "pm1"

trainer:
  name: "dynamical"
  kwargs:
    warmup_n_iter : 1
    train_clamped_n_iter : 9 # in order to match we need one less
    train_free_n_iter : 10
    eval_n_iter : 20

model:
  name: fc-baseline
  kwargs:
    dim_data: 784
    dim_hidden: 1000
    num_labels: 10
    strength_forth: 4.0
    strength_back: 0.9
    threshold_in: 0.8
    threshold_j: 1.0
    threshold_out: 1.0
    j_d: 0.5

wandb:
  tags: ["fc-baseline", "mnist", "dynamical"]