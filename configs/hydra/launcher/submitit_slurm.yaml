# conf/hydra/launcher/submitit_slurm.yaml
# @package hydra.launcher

_target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher

# Where Submitit stores job metadata & stdout/err
submitit_folder: ${hydra.sweep.dir}/.submitit

# SLURM resources – match your current script
timeout_min: 20
cpus_per_task: 4
gpus_per_node: 0 # set to 1 if you uncomment --gres=gpu:1
tasks_per_node: 1
nodes: 1
mem_gb: 8

# How many jobs from the sweep can run in parallel
array_parallelism: 32

name: ${hydra.job.name}

# Additional raw SBATCH args
additional_parameters:
  comment: "preemption=yes;requeue=yes"

# Optional: retry-on-timeout
max_num_timeout: 0 # or >0 if you want automatic resubmits

# If you want stdout+stderr in one file:
stderr_to_stdout: true
