[project]
name = "local_exp"
version = "0.1.0"
description = "Local experiments based on darnax."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "darnax",
    "datasets>=4.2.0",
    "equinox>=0.12.2",
    "huggingface-hub>=1.1.1",
    "hydra-core>=1.3.2",
    "hydra-submitit-launcher>=1.2.0",
    "ipython>=9.7.0",
    "matplotlib>=3.10.7",
    "optax>=0.2.6",
    "pillow>=11.3.0",
    "pytorch-lightning>=2.5.6",
    "torch>=2.9.0",
    "torchmetrics>=1.8.2",
    "torchvision>=0.24.0",
    "wandb>=0.22.2",
]

[tool.uv.sources]
darnax = { git = "https://github.com/Willinki/darnax.git", branch="mattia" }
local-exp = { workspace = true }

[tool.uv.workspace]
members = [
    ".",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "local-exp",
]

[tool.hatch.build.targets.wheel]
packages = ["src/local_exp"]
